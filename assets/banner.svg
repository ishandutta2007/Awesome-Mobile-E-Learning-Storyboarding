<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161233" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.15" />
    </linearGradient>

    <!-- Card Filters / Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.28" />
      <circle cx="40" cy="40" r="1.2" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beamShimmer {
        0% { opacity: 0.15; transform: translateX(-60px); }
        50% { opacity: 0.45; transform: translateX(60px); }
        100% { opacity: 0.15; transform: translateX(-60px); }
      }

      .floating-card-left {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-right {
        animation: floatMedium 8.5s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-pill-1 {
        animation: floatFast 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatFast 5.5s ease-in-out infinite 1s;
      }
      .floating-pill-3 {
        animation: floatFast 6.5s ease-in-out infinite 0.5s;
      }
      .pulse-ambient {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 20s linear infinite;
      }
      .canvas-beam {
        animation: beamShimmer 10s ease-in-out infinite;
      }

      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Pulsing Glow Orbs (Subtle Background) -->
  <ellipse class="pulse-ambient" cx="180" cy="120" rx="260" ry="180" fill="url(#glowCyan)" />
  <ellipse class="pulse-ambient" cx="1020" cy="280" rx="300" ry="220" fill="url(#glowPurple)" />
  <ellipse class="pulse-ambient" cx="600" cy="390" rx="280" ry="120" fill="url(#glowAmber)" />

  <!-- Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Connecting Flowlines (Background Architecture) -->
  <g opacity="0.38">
    <path class="flow-line" d="M 60,80 Q 240,40 420,100 T 780,90 T 1140,110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 80,360 Q 300,320 540,350 T 960,330 T 1120,370" fill="none" stroke="#818cf8" stroke-width="1.8" />
  </g>

  <!-- BACKGROUND FLOATING CARDS (Kept in corners to never occlude foreground title) -->

  <!-- Top-Left Floating Storyboard Scene Panel (Dimmed) -->
  <g class="floating-card-left" filter="url(#shadow)" opacity="0.75">
    <g transform="translate(45, 45)">
      <rect width="170" height="110" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <!-- Scene thumbnail header -->
      <rect x="12" y="12" width="60" height="12" rx="4" fill="#38bdf8" fill-opacity="0.25" />
      <text x="18" y="21" class="badge-text" fill="#38bdf8" font-size="9">SHOT 01 : INT</text>
      <!-- Mini panel illustration elements -->
      <rect x="12" y="32" width="146" height="52" rx="6" fill="#0f172a" fill-opacity="0.9" />
      <circle cx="50" cy="56" r="14" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2" />
      <path d="M 75 62 L 140 62" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <path d="M 75 70 L 125 70" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <!-- Duration Pill -->
      <rect x="110" y="90" width="48" height="12" rx="3" fill="#334155" fill-opacity="0.6" />
      <text x="120" y="99" class="badge-text" fill="#94a3b8" font-size="8">00:04.5s</text>
    </g>
  </g>

  <!-- Bottom-Left Floating Touch-Gestures Panel (Dimmed) -->
  <g class="floating-pill-2" filter="url(#shadow)" opacity="0.8">
    <g transform="translate(60, 275)">
      <rect width="180" height="95" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <!-- Mobile Touch Screen Icon & Gesture -->
      <rect x="14" y="14" width="45" height="68" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="36" cy="74" r="3" fill="#64748b" />
      <rect x="20" y="22" width="33" height="44" rx="2" fill="#1e293b" />
      <!-- Touch Stylus Pointer -->
      <path d="M 36,44 Q 52,35 68,26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="36" cy="44" r="3.5" fill="#38bdf8" />
      <text x="75" y="42" class="badge-text" fill="#e2e8f0" font-size="11">Touch-Ready</text>
      <text x="75" y="58" class="badge-text" fill="#94a3b8" font-size="9.5">Stylus &amp; Gestures</text>
      <text x="75" y="73" class="badge-text" fill="#38bdf8" font-size="9">Infinite Zoom</text>
    </g>
  </g>

  <!-- Top-Right Floating Infinite Canvas Mini-Map (Dimmed) -->
  <g class="floating-card-right" filter="url(#shadow)" opacity="0.8">
    <g transform="translate(980, 50)">
      <rect width="175" height="115" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.45" />
      <text x="16" y="24" class="badge-text" fill="#c084fc" font-size="10.5">CANVAS TOPOLOGY</text>
      <!-- Connected Nodes -->
      <rect x="18" y="40" width="38" height="26" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
      <text x="25" y="56" fill="#e2e8f0" font-size="8.5">Intro</text>
      <path d="M 56,53 L 80,53" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 2" />
      <rect x="80" y="40" width="42" height="26" rx="4" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1" />
      <text x="86" y="56" fill="#e2e8f0" font-size="8.5">Module</text>
      <path d="M 101,66 L 101,82" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 2" />
      <rect x="80" y="82" width="42" height="24" rx="4" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1" />
      <text x="88" y="97" fill="#e2e8f0" font-size="8.5">Quiz</text>
    </g>
  </g>

  <!-- Bottom-Right Floating Animatics / Video Export Card (Dimmed) -->
  <g class="floating-pill-3" filter="url(#shadow)" opacity="0.8">
    <g transform="translate(965, 275)">
      <rect width="185" height="95" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
      <rect x="14" y="16" width="48" height="34" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <!-- Play Triangle -->
      <polygon points="32,27 32,39 42,33" fill="#34d399" />
      <text x="72" y="32" class="badge-text" fill="#e2e8f0" font-size="11">Animatic Export</text>
      <text x="72" y="46" class="badge-text" fill="#94a3b8" font-size="9.5">Audio &amp; Voiceover Sync</text>
      <!-- Timeline Track -->
      <rect x="14" y="60" width="156" height="18" rx="4" fill="#1e293b" />
      <rect x="18" y="64" width="36" height="10" rx="2" fill="#3b82f6" />
      <rect x="58" y="64" width="48" height="10" rx="2" fill="#8b5cf6" />
      <rect x="110" y="64" width="54" height="10" rx="2" fill="#10b981" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: MAIN HEADER, TITLE, SUBTITLE & INTERACTIVE PILLS -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(600, 72)">
    <g transform="translate(-165, 0)">
      <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
      <!-- Pulsing Dot -->
      <circle cx="20" cy="17" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="22" class="pill-text" fill="#e0f2fe">CURATED AWESOME ECOSYSTEM • 2026</text>
    </g>
  </g>

  <!-- Primary Headline Title -->
  <g transform="translate(600, 150)">
    <!-- Subtle Backing Drop Shadow for Title Contrast -->
    <text text-anchor="middle" y="2" class="banner-title" fill="#030712" opacity="0.75" filter="url(#shadow)">
      Mobile E-Learning Storyboarding
    </text>
    <text text-anchor="middle" y="0" class="banner-title" fill="url(#titleGrad)">
      Mobile E-Learning Storyboarding
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 196)">
    <text text-anchor="middle" class="banner-subtitle">
      Touch-Optimized Storyboarding • Infinite Canvas Collaboration • Self-Hosted Pre-Production
    </text>
  </g>

  <!-- Dynamic Floating Feature Pills (Foreground Center-Row) -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: Touch-Optimized -->
    <g class="floating-pill-1" transform="translate(-390, 0)">
      <rect width="140" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="70" y="22" text-anchor="middle" class="pill-text" fill="#7dd3fc">📱 Touch-Ready</text>
    </g>

    <!-- Pill 2: Infinite Canvas -->
    <g class="floating-pill-2" transform="translate(-230, 0)">
      <rect width="150" height="34" rx="17" fill="url(#pillGrad2)" stroke="#c084fc" stroke-width="1.2" />
      <text x="75" y="22" text-anchor="middle" class="pill-text" fill="#e9d5ff">🎨 Infinite Canvas</text>
    </g>

    <!-- Pill 3: Animatics -->
    <g class="floating-pill-3" transform="translate(-60, 0)">
      <rect width="130" height="34" rx="17" fill="url(#pillGrad3)" stroke="#34d399" stroke-width="1.2" />
      <text x="65" y="22" text-anchor="middle" class="pill-text" fill="#a7f3d0">🎬 Animatics</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g class="floating-pill-1" transform="translate(90, 0)">
      <rect width="155" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="77" y="22" text-anchor="middle" class="pill-text" fill="#bae6fd">⚡ Real-Time Sync</text>
    </g>

    <!-- Pill 5: Self-Hostable -->
    <g class="floating-pill-2" transform="translate(265, 0)">
      <rect width="130" height="34" rx="17" fill="url(#pillGrad2)" stroke="#f472b6" stroke-width="1.2" />
      <text x="65" y="22" text-anchor="middle" class="pill-text" fill="#fbcfe8">🔒 Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Visual Accent Bar -->
  <g transform="translate(300, 345)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <circle cx="300" cy="0" r="4" fill="#818cf8" />
  </g>

  <g transform="translate(600, 380)">
    <text text-anchor="middle" class="badge-text" fill="#64748b" font-size="12">
      Instructional Design • Visual Course Mapping • Tablet Storyboards • Animatic Pipelines
    </text>
  </g>
</svg>
